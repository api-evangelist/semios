aid: semios
name: Semios
description: >-
  Semios (legally SemiosBio Technologies Inc., Vancouver, British Columbia,
  founded 2010 by Michael Gilbert) is a precision-agriculture company that
  operates a large in-canopy IoT sensor network for permanent crops - almonds,
  apples, cherries, citrus, grapes, pears, pistachios, stone fruit and walnuts.
  Its sensors report climate, soil moisture, insect trap counts and plant-stress
  readings on roughly ten-minute intervals, and its platform layers degree-day
  models, disease and frost risk models and machine learning on top of that feed
  to drive insect pest management (including variable-rate aerosol mating
  disruption), disease management, frost management, irrigation and water
  management, plant-stress monitoring, and alerting and reporting. Growers and
  agronomists consume it through the Semios Hub web and mobile applications,
  backed by the hub-api.semios.com service. Semios acquired Agworld, Altrac and
  Centricity, and in October 2024 the group unified those brands under the
  Almanac name, with Semios continuing as the sensing and crop-protection brand.
  Semios does not operate a public developer portal - the Hub API is customer
  and partner authenticated, and integrations such as the WiseConn irrigation
  integration are arranged directly.
